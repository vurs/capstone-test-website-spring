services:

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: vulndb
      POSTGRES_USER: vulnuser
      POSTGRES_PASSWORD: vulnpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
#      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  app:
    build: ./app
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata: