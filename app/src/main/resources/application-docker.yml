server:
  port:
    8081

spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: spring-client
            client-secret: kQdIqWvvr8heezM4qNvErQszZ2SHps0I
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/spring-client"

        provider:
          keycloak:
            user-name-attribute: preferred_username
            issuer-uri: http://host.docker.internal:8080/realms/test-realm

  application:
    name: capstone-test-website-spring

  datasource:
    url: jdbc:postgresql://db:5432/vulndb
    username: vulnuser
    password: vulnpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

    database-platform: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

logging:
  level:
    org:
      springframework:
        security: DEBUG