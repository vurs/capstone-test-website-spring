server:
  port:
    8081

app:
  keycloak:
    # Browser-facing end-session URL for RP-initiated logout (must match the
    # public Keycloak hostname, same as authorization-uri).
    logout-uri: ${KEYCLOAK_LOGOUT_URI:http://host.docker.internal:8080/realms/test-realm/protocol/openid-connect/logout}

spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: spring-client
            client-secret: kQdIqWvvr8heezM4qNvErQszZ2SHps0I
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/spring-client"

        provider:
          keycloak:
            # Explicit endpoints (no issuer-uri) so AWS can send browsers to the
            # public Keycloak URL while the app uses the Docker-network hostname
            # for token/JWKS calls. Defaults suit local docker compose.
            authorization-uri: ${KEYCLOAK_AUTH_URI:http://host.docker.internal:8080/realms/test-realm/protocol/openid-connect/auth}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://host.docker.internal:8080/realms/test-realm/protocol/openid-connect/token}
            user-info-uri: ${KEYCLOAK_USERINFO_URI:http://host.docker.internal:8080/realms/test-realm/protocol/openid-connect/userinfo}
            jwk-set-uri: ${KEYCLOAK_JWK_URI:http://host.docker.internal:8080/realms/test-realm/protocol/openid-connect/certs}
            user-name-attribute: preferred_username

  application:
    name: capstone-test-website-spring

  datasource:
    url: jdbc:postgresql://db:5432/vulndb
    username: vulnuser
    password: vulnpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

    database-platform: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

logging:
  level:
    org:
      springframework:
        security: DEBUG
