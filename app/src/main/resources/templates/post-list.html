<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Post List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="header-container">
    <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom"><a href="/"
                                                                                       class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
             class="bi bi-bug-fill ms-4 me-2" viewBox="0 0 16 16">
            <path d="M4.978.855a.5.5 0 1 0-.956.29l.41 1.352A5 5 0 0 0 3 6h10a5 5 0 0 0-1.432-3.503l.41-1.352a.5.5 0 1 0-.956-.29l-.291.956A5 5 0 0 0 8 1a5 5 0 0 0-2.731.811l-.29-.956z"/>
            <path d="M13 6v1H8.5v8.975A5 5 0 0 0 13 11h.5a.5.5 0 0 1 .5.5v.5a.5.5 0 1 0 1 0v-.5a1.5 1.5 0 0 0-1.5-1.5H13V9h1.5a.5.5 0 0 0 0-1H13V7h.5A1.5 1.5 0 0 0 15 5.5V5a.5.5 0 0 0-1 0v.5a.5.5 0 0 1-.5.5zm-5.5 9.975V7H3V6h-.5a.5.5 0 0 1-.5-.5V5a.5.5 0 0 0-1 0v.5A1.5 1.5 0 0 0 2.5 7H3v1H1.5a.5.5 0 0 0 0 1H3v1h-.5A1.5 1.5 0 0 0 1 11.5v.5a.5.5 0 1 0 1 0v-.5a.5.5 0 0 1 .5-.5H3a5 5 0 0 0 4.5 4.975"/>
        </svg>
        <span class="fs-4">The Vulnerable Blog</span> </a>
        <ul class="nav nav-pills">
            <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="/post-list" class="nav-link active" aria-current="page">Post List</a></li>
            <li class="nav-item"><a href="/users" class="nav-link">User Search</a></li>
            <li class="nav-item"><a href="/network" class="nav-link">Network Diagnostics</a></li>
            <li class="nav-item"><a href="/csrf-demo" class="nav-link">CSRF Demo</a></li>
            <li class="nav-item"><a href="/clickjacking-demo" class="nav-link">Clickjacking Demo</a></li>
            <li class="nav-item"><a href="/masking-demo" class="nav-link">Masking Demo</a></li>
            <li class="nav-item me-4" th:if="${!isAuthenticated}">
                <a href="/login" class="nav-link">Login</a>
            </li>
            <li class="nav-item me-4" th:if="${isAuthenticated}">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="nav-link border-0 bg-transparent">Logout</button>
                </form>
            </li>
        </ul>
    </header>
</div>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Post List</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <form id="search-form" class="d-flex ms-auto">
                <input id="search-input" class="form-control me-2" type="search" placeholder="Search for a post..." aria-label="Search">
                <button class="btn btn-outline-primary" type="submit">Search</button>
            </form>
        </div>
    </div>
</nav>
<div id="container-searched">
    <p id="result-message"></p>
</div>
<div class="container">
    <div th:each="post : ${posts}" class="mt-3">
        <h3 th:utext="${post.title}"></h3>
        <p th:utext="${post.content}"></p>
        <a th:href="@{'/post/' + ${post.id}}" class="btn btn-primary btn-sm">Read more</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script>
    document.getElementById("search-form").addEventListener("submit", function(event) {
        event.preventDefault();

        var searchTerm = document.getElementById("search-input").value;
        var messageElement = document.getElementById("result-message");

        messageElement.innerHTML = "Showing results for: " + searchTerm;
        messageElement.style.display = "block";
    });
</script>
</body>
</html>
