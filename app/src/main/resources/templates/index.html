<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog</title>
</head>
<body>
    <h1>Blog</h1>
    <a href="/new">New Post</a>

    <div th:each="post : ${posts}">
        <h2 th:utext="${post.title}"></h2>
        <a th:href="@{'/post/' + ${post.id}}">Read more</a>
    </div>
</body>
</html>
