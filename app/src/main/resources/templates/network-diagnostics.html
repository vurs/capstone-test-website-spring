<body>
<div class="header-container">
    <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom"><a href="/"

            <li class="nav-item"><a href="/post-list" class="nav-link">Post List</a></li>

</div>
<div class="container col-lg-8 py-4">
    <h1 class="mb-3">Network Diagnostics</h1>
    <p class="lead">Ping a host to check basic reachability.</p>
    <form action="/network/ping" method="get" class="row g-3 align-items-end">
        <div class="col-md-8">
            <label for="host" class="form-label">Host or IP address</label>
            <input type="text" class="form-control" id="host" name="host"
                   placeholder="e.g. 127.0.0.1" required>
        </div>
        <div class="col-md-4">
            <button type="submit" class="btn btn-primary w-100">Ping</button>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
